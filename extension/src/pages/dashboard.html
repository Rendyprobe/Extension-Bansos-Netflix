<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Bansos Netflix</title>
  <link rel="stylesheet" href="../styles/dashboard.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Header -->
    <div class="header">
      <h1>🎬 Bansos Netflix</h1>
      <div class="user-section">
        <span id="username-display">Loading...</span>
        <button id="logout-btn" class="btn-logout">Logout</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content">
      <!-- Search Bar -->
      <div class="search-bar">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search bahan..." 
        >
      </div>

      <!-- Bahan List -->
      <div class="bahan-list" id="bahan-list">
        <div class="loading">Loading bahan...</div>
      </div>

      <!-- Error Message -->
      <div id="error-message" class="error-message"></div>
    </div>

    <!-- Generate Token Modal -->
    <div id="token-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Generated Token</h2>
          <button class="btn-close" id="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="token-display">
            <textarea id="token-content" readonly></textarea>
          </div>
          <button id="copy-token-btn" class="btn-primary">Copy to Clipboard</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../services/storage.js"></script>
  <script src="../services/api.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
