<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Bansos Netflix</title>
  <link rel="stylesheet" href="../styles/dashboard.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Header -->
    <div class="header">
      <h1>🎬 Bansos Netflix</h1>
      <div class="user-section">
        <span id="username-display">Loading...</span>
        <button id="logout-btn" class="btn-logout">Logout</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content">

      <!-- Status Card -->
      <div class="status-card" id="status-card">
        <div class="status-idle" id="status-idle">
          <div class="status-icon">📦</div>
          <p class="status-text">Belum ada bahan dipilih</p>
          <p class="status-sub">Klik <strong>Ambil Bahan</strong> untuk mulai</p>
        </div>

        <div class="status-loaded hidden" id="status-loaded">
          <div class="status-icon">✅</div>
          <p class="status-label">Bahan aktif:</p>
          <p class="bahan-name" id="bahan-name">—</p>
          <div class="exp-badge" id="exp-badge">
            <span class="exp-icon">📅</span>
            <span id="exp-text">Exp: —</span>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button id="btn-ambil" class="btn-action btn-ambil">
          <span class="btn-icon">🎲</span>
          <span class="btn-label">Ambil Bahan</span>
        </button>
        <button id="btn-generate" class="btn-action btn-generate" disabled>
          <span class="btn-icon">🔗</span>
          <span class="btn-label">Generate URL</span>
        </button>
      </div>

      <!-- Result Box -->
      <div class="result-box hidden" id="result-box">
        <div class="result-header">
          <span class="result-title" id="result-title">URL Generated</span>
          <button id="btn-copy" class="btn-copy-inline">Copy</button>
        </div>
        <div class="result-content" id="result-content"></div>
      </div>

      <!-- Error -->
      <div id="error-message" class="error-message"></div>
    </div>
  </div>

  <script src="../services/storage.js"></script>
  <script src="../services/api.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
